{% extends '_gate.html' %}{% block card %}<h2>Login or Register</h2><p class="m">New or returning patient: use the same steps.</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><label for="nm">Your name</label><input id="nm" name="name" maxlength="80" autocomplete="name" placeholder="Name as on your ID">
<label for="ph">Mobile number</label><input id="ph" name="phone" inputmode="numeric" maxlength="13" autocomplete="tel" placeholder="10-digit mobile" required>
<button class="p">Send OTP</button></form>{% endblock %}
