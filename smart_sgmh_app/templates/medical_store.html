{% extends 'base.html' %}{% block body %}<h2>Medical Store</h2><div class="c"><form method="get" style="display:flex;gap:8px"><input name="q" value="{{ text }}" placeholder="Search medicine" style="margin:0"><button>Search</button></form></div>
<div class="c"><div class="tw"><table><tr><th>Medicine</th><th>Category</th><th>Stock</th></tr>{% for r in rows %}<tr><td>{{ r.name }}</td><td>{{ r.category }}</td><td><span class="tag" style="background:{{ '#d9534f' if r.st=='Out of stock' else '#8a948d' if r.st=='Low stock' else '#1b9e5a' }}">{{ r.st }}</span></td></tr>{% endfor %}</table></div></div>
<p class="m">Sample stock data. Confirm at the counter. Expired batches are never counted.</p>{% endblock %}
