{% extends 'base.html' %}{% block body %}<h2>Doctor availability</h2><div class="c"><form method="get" style="display:flex;gap:8px;flex-wrap:wrap"><input name="q" value="{{ text }}" placeholder="Name or department" style="flex:2;margin:0">
<select name="dept" style="flex:1;margin:0"><option value="">All departments</option>{% for x in depts %}<option value="{{ x }}" {{ 'selected' if x==dept }}>{{ x }}</option>{% endfor %}</select><button>Search</button></form></div>
<div class="row">{% for d in docs %}{% include '_doc.html' %}{% else %}<div class="c">No doctors found.</div>{% endfor %}</div>{% endblock %}
